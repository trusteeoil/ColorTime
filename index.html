<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<!-- Ask search engines, image search and AI scrapers to skip this page (polite bots obey; it is not a lock) -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<title>Color Time</title>
<style>
  /* ---------- Base: light theme only, no text selection, no double-tap zoom ---------- */
  :root { color-scheme: light; --ink:#222; --bg:#ffffff; --blue:#3a86ff; --green:#2fbf5b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:manipulation; }
  button { font:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; }

  /* Only one screen is visible at a time. JS toggles the "on" class. */
  .screen { display:none; height:100dvh; width:100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #home.on, #done.on { display:flex; flex-direction:column; }
  #paint.on { display:grid; }

  /* ---------- Shared look of the pictures (applies to inline SVGs) ----------
     .r    = a tappable area (white until colored)
     .line = decoration lines that are never tappable */
  .r { fill:#fff; stroke:#222; stroke-width:var(--sw,6); stroke-linejoin:round; cursor:pointer; }
  .line { fill:none; stroke:#222; stroke-width:var(--sw,6); stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  /* Small fade-in on tap. Opacity (not scale) so shapes with their own transform don't jump. */
  @keyframes pop { 0% { opacity:.35; } 100% { opacity:1; } }
  .r.pop { animation: pop .28s ease; }

  /* ---------- Home screen ---------- */
  #home h1 { margin:0; padding:18px 12px 0; text-align:center; font-size:clamp(32px,7vmin,64px); letter-spacing:1px; }
  #home { position:relative; }
  /* The wrapper is the scroller; the grid inside just takes its natural height, so rows never get squashed */
  #galleryWrap { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  /* Vertical scroll, two pictures per row */
  #gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(14px,3vw,28px); align-content:start;
    max-width:1000px; margin:0 auto; padding:18px clamp(14px,4vw,32px) 40px; }
  .card { position:relative; width:100%; aspect-ratio:4/3; background:#fff; border-radius:22px; border:5px solid var(--ink);
    box-shadow:0 6px 0 rgba(0,0,0,.15); overflow:hidden; padding:0; }
  .card:active { transform:scale(.97); }
  .card svg, .card canvas, .card img { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  .badge { position:absolute; top:6px; right:6px; width:clamp(30px,9vw,52px); height:clamp(30px,9vw,52px); border-radius:12px;
    background:var(--green); display:flex; align-items:center; justify-content:center; border:3px solid #fff; }
  .badge svg { width:70%; height:70%; }
  /* Settings gear: top right, faint, out of the way of the pictures */
  #gearBtn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; width:44px; height:44px; opacity:.35; font-size:24px; z-index:3; }

  /* ---------- Paint screen ----------
     Left column = color style dots, bottom = palette, center = picture */
  #paint { grid-template-columns:auto 1fr; grid-template-rows:auto 1fr auto;
    grid-template-areas:"top top" "cats art" "cats pal"; }
  #top { grid-area:top; display:flex; justify-content:space-between; padding:10px 14px; }
  .bigbtn { width:clamp(54px,9vmin,76px); height:clamp(54px,9vmin,76px); border-radius:18px; border:5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; background:#fff; box-shadow:0 5px 0 rgba(0,0,0,.18); }
  .bigbtn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .bigbtn svg { width:62%; height:62%; }
  #doneBtn { background:var(--green); }
  /* Hold-to-reset button: a red fill rises while held; letting go early cancels it */
  #resetBtn { position:relative; overflow:hidden; touch-action:none; }
  #resetBtn svg { position:relative; z-index:1; }
  #resetBtn .prog { position:absolute; left:0; bottom:0; width:100%; height:0; background:#ff9d9d; }
  #resetBtn.holding .prog { animation: fillup 1.2s linear forwards; }
  @keyframes fillup { to { height:100%; } }
  /* Small hint shown when the reset button is only tapped */
  #hint { position:fixed; left:50%; bottom:22%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px;
    border-radius:30px; font-size:20px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s; z-index:9; }
  #hint.on { opacity:.92; }
  #undoBtn:disabled { opacity:.35; box-shadow:none; cursor:default; }

  /* ---------- Effects layer: tap sparkles and done-screen confetti ---------- */
  #fx { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:8; }
  .spark { position:absolute; font-size:26px; line-height:1; -webkit-text-stroke:1.5px #222; transform:translate(-50%,-50%);
    animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3) rotate(180deg); opacity:0; } }
  .conf { position:absolute; top:-30px; width:14px; height:22px; border-radius:3px; border:2px solid #222; animation: fall linear forwards; }
  @keyframes fall { to { transform:translateY(115vh) rotate(720deg); } }
  #cats { grid-area:cats; display:flex; flex-direction:column; justify-content:center; gap:clamp(14px,4vmin,30px); padding:6px 10px 6px 14px; }
  .dot { width:clamp(48px,11vmin,84px); height:clamp(48px,11vmin,84px); border-radius:50%; }
  .dot svg, .sw svg { width:100%; height:100%; display:block; }
  /* Selected dot/swatch gets a thick ring so a toddler can see what is active */
  .dot.active, .sw.active { box-shadow:0 0 0 4px #fff, 0 0 0 9px var(--ink); transform:scale(1.06); }
  #art { grid-area:art; position:relative; min-height:0; min-width:0; }
  canvas, .card img { object-fit:contain; }
  #art svg, #art canvas { position:absolute; left:12px; right:12px; top:6px; bottom:6px; width:calc(100% - 24px); height:calc(100% - 12px);
    background:#fff; border-radius:18px; box-shadow:0 6px 0 rgba(0,0,0,.15); }
  #pal { grid-area:pal; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:clamp(10px,2.4vmin,20px); padding:14px 14px 14px 8px; }
  .sw { width:clamp(40px,8.2vmin,70px); height:clamp(40px,8.2vmin,70px); border-radius:50%; }

  /* ---------- Done screen ---------- */
  #done { align-items:center; overflow-y:auto; padding-bottom:24px; touch-action:pan-y; }
  #done h2 { margin:18px 0 8px; font-size:clamp(30px,7vmin,60px); text-align:center; }
  #doneArt { width:min(92vw,720px); aspect-ratio:4/3; flex:none; }
  #doneArt svg, #doneArt canvas { width:100%; height:100%; display:block; background:#fff; border-radius:20px; border:6px solid var(--ink); pointer-events:none; }
  #order { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin:18px 12px 6px; max-width:760px; }
  .ord { position:relative; width:clamp(44px,9vmin,64px); height:clamp(44px,9vmin,64px); }
  .ord svg { width:100%; height:100%; display:block; }
  .ord b { position:absolute; left:-6px; top:-8px; min-width:24px; height:24px; padding:0 5px; border-radius:12px; background:var(--ink);
    color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center; }
  #doneBtns { display:flex; gap:18px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .pill { padding:16px 34px; border-radius:40px; font-size:clamp(22px,4.5vmin,34px); font-weight:700; border:5px solid var(--ink);
    background:#fff; box-shadow:0 6px 0 rgba(0,0,0,.18); }
  .pill.main { background:var(--blue); color:#fff; }
  .pill:active { transform:translateY(3px); }

  /* ---------- PIN lock: covers everything until the right PIN is entered ---------- */
  #lock { position:fixed; inset:0; background:#fff; z-index:100; display:flex; align-items:center; justify-content:center; }
  #lock.off { display:none; }
  #lock .lockbox { text-align:center; padding:20px; }
  #lock .privnote { margin:-8px 0 16px; font-size:16px; color:#555; }
  #lock h2 { margin:0 0 18px; font-size:clamp(26px,5vmin,40px); }
  #pinDots { display:flex; justify-content:center; gap:18px; margin-bottom:10px; }
  #pinDots i { width:24px; height:24px; border-radius:50%; border:4px solid var(--ink); }
  #pinDots i.on { background:var(--ink); }
  #pinMsg { height:26px; margin-bottom:10px; font-size:18px; color:#c1121f; font-weight:700; }
  #pad { display:grid; grid-template-columns:repeat(3,auto); gap:14px; justify-content:center; }
  #pad button { width:clamp(62px,15vmin,90px); height:clamp(62px,15vmin,90px); border-radius:50%; border:4px solid var(--ink);
    background:#fff; font-size:clamp(26px,6vmin,36px); font-weight:700; box-shadow:0 5px 0 rgba(0,0,0,.18); }
  #pad button:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  #pad button:disabled { opacity:.35; }
  #pinDots.shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform:translateX(-10px); } 40%,80% { transform:translateX(10px); } }

  /* ---------- Settings (grown-ups only, tucked away on home screen) ---------- */
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:10; }
  #settings.on { display:flex; }
  #settings .box { max-height:92dvh; overflow-y:auto; background:#fff; border:5px solid var(--ink); border-radius:24px; padding:24px; width:min(88vw,380px); text-align:center; }
  #settings p { margin:0 0 16px; font-size:16px; }
  #settings .pill { font-size:18px; padding:12px 22px; margin:6px; }
</style>
</head>
<body>

<!-- PIN lock (shown first; JS hides it after the right PIN) -->
<div id="lock">
  <div class="lockbox">
    <h2>Enter PIN</h2>
    <div class="privnote">For personal use only</div>
    <div id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div id="pinMsg"></div>
    <div id="pad">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <button data-d="x" aria-label="Clear">&#9003;</button><button data-d="0">0</button><span></span>
    </div>
  </div>
</div>

<!-- Hidden SVG that holds every color pattern (sparkle + stripes). Sized 0x0 instead of display:none,
     because some browsers refuse to use patterns from a display:none SVG. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<!-- HOME: gallery of pictures -->
<section id="home" class="screen on">
  <h1>Let's Color!</h1>
  <div id="galleryWrap">
    <div id="gallery"></div>
  </div>
  <button id="gearBtn" aria-label="Settings">&#9881;</button>
</section>

<!-- PAINT: tools on the left, picture in the middle, palette along the bottom -->
<section id="paint" class="screen">
  <div id="top">
    <button class="bigbtn" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </button>
    <!-- Undo the last tap (toddlers mis-tap a lot, this is gentler than reset) -->
    <button class="bigbtn" id="undoBtn" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15L4 10l5-5"/><path d="M4 10h9a5.5 5.5 0 0 1 0 11H8"/></svg>
    </button>
    <!-- Hold this to wipe the current picture back to blank (a quick tap does nothing but show a hint) -->
    <button class="bigbtn" id="resetBtn" aria-label="Hold to start over">
      <div class="prog"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V8h-4.5"/></svg>
    </button>
    <button class="bigbtn" id="doneBtn" aria-label="All done">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    </button>
  </div>
  <div id="cats"></div>
  <div id="art"></div>
  <div id="pal"></div>
</section>

<!-- DONE: finished picture plus the order the colors were used -->
<section id="done" class="screen">
  <h2>&#11088; Great job! &#11088;</h2>
  <div id="doneArt"></div>
  <div id="order"></div>
  <div id="doneBtns">
    <button class="pill main" id="doneHome">Home</button>
    <button class="pill" id="keepBtn">Keep coloring</button>
  </div>
</section>

<div id="hint">Hold to start over</div>
<div id="fx"></div>

<!-- SETTINGS -->
<div id="settings">
  <div class="box">
    <p><b>Color Time</b><br><span id="ver"></span></p>
    <button class="pill" id="soundBtn">Sound: On</button>
    <button class="pill" id="addBtn">Add pictures (SVG files)</button>
    <input type="file" id="fileIn" accept=".svg,image/svg+xml" multiple hidden>
    <p id="addMsg" style="margin:4px 0 0;font-size:15px"></p>
    <button class="pill" id="removeBtn">Remove added pictures</button>
    <button class="pill" id="eraseBtn">Erase all coloring</button>
    <button class="pill main" id="closeSet">Close</button>
  </div>
</div>

<script>
/* ===================================================================
   Color Time: a toddler coloring game. Single file, no libraries.
   Pictures are SVGs. Every shape with class="r" is a tappable area.
   =================================================================== */

// Bump on every code change (CalVer with daily build number)
const VERSION = 'v2026.11.01.17';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

/* ---------- Colors ----------
   10 main colors. Each can be used as solid (s), sparkle (p), or stripes (t).
   A "color key" is style letter + color index, like "s3" or "t7". Keys are what we save. */
const COLORS = [
  { n:'Red',    h:'#e63946' }, { n:'Orange', h:'#ff9f1c' }, { n:'Yellow', h:'#ffd60a' },
  { n:'Green',  h:'#38b000' }, { n:'Sky',    h:'#4cc9f0' }, { n:'Blue',   h:'#2f5bea' },
  { n:'Purple', h:'#9d4edd' }, { n:'Pink',   h:'#ff7eb6' }, { n:'Brown',  h:'#8d5a3b' },
  { n:'Black',  h:'#222222' }
];

/* Build the sparkle and stripe patterns once. Two sets:
   "a" = for the pictures (big tiles), "w" = for the small swatch dots (small tiles). */
function buildDefs() {
  const star = (cx, cy, r) =>   // a concave 4-point sparkle
    `M${cx},${cy - r}Q${cx},${cy} ${cx + r},${cy}Q${cx},${cy} ${cx},${cy + r}Q${cx},${cy} ${cx - r},${cy}Q${cx},${cy} ${cx},${cy - r}Z`;
  let h = '';
  [['a', 1], ['w', 0.5]].forEach(([set, s]) => {
    const T = 60 * s, sk = (1.5 * s).toFixed(2);
    COLORS.forEach((c, i) => {
      // Sparkle: color background with white/silver stars
      const stars = [[14,16,11],[42,34,14],[18,50,7],[52,8,6]]
        .map(([x, y, r]) => `<path d="${star(x * s, y * s, r * s)}" fill="#fff" stroke="#b8c2cc" stroke-width="${sk}"/>`).join('');
      h += `<pattern id="${set}-p-${i}" width="${T}" height="${T}" patternUnits="userSpaceOnUse">
              <rect width="${T}" height="${T}" fill="${c.h}"/>${stars}</pattern>`;
      // Stripes: diagonal color + white bands
      const ST = 22 * s;   // stripe tile: small = thin stripes, many per shape
      h += `<pattern id="${set}-t-${i}" width="${ST}" height="${ST}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="${ST}" height="${ST}" fill="#fff"/><rect width="${ST}" height="${ST / 2}" fill="${c.h}"/></pattern>`;
    });
  });
  $('defs').innerHTML = h;
  startShimmer();
}

/* Sparkle motion: the stars stay in place and slowly fade in and out (a gentle glow), each at a
   different time. No sliding, which can feel dizzy. Done in JS (not SMIL) because Safari does not
   always repaint animated patterns. Runs about 22 times per second. */
function startShimmer() {
  const pats = [...document.querySelectorAll('#defs pattern')].filter(el => el.id.includes('-p-'))
    .map((el, n) => ({ n, stars: [...el.querySelectorAll('path')] }));
  let last = 0;
  (function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 45) return;
    last = t;
    const sec = t / 1000;
    pats.forEach(({ n, stars }) => {
      stars.forEach((st, i) => st.setAttribute('opacity', (0.5 + 0.5 * Math.sin(sec * 3 + i * 1.9 + n)).toFixed(2)));
    });
  })(0);
}

// Turn a color key into a CSS fill value. set = 'a' (pictures) or 'w' (swatches)
function fillFor(key, set) {
  const i = +key.slice(1), st = key[0];
  return st === 's' ? COLORS[i].h : `url(#${set}-${st}-${i})`;
}
// Small round swatch used for dots, palette and the "color order" row
const swatchSVG = key =>
  `<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="35" fill="${fillFor(key, 'w')}" stroke="#222" stroke-width="4"/></svg>`;

/* ---------- Built-in pictures (viewBox 0 0 800 600) ----------
   Shapes are listed back to front. Later shapes sit on top of earlier ones. */
const CLOUD = 'M120,180 C80,180 75,130 120,125 C125,85 185,75 205,110 C235,85 290,105 285,145 C325,150 325,185 285,185 Z';

const DOG_SVG = `
  <rect class="r" x="3" y="3" width="794" height="594"/>
  <path class="r" d="M-3000,370 H3 Q200,340 400,365 T797,355 H3800 V3600 H-3000 Z"/>
  <circle class="r" cx="680" cy="110" r="60"/>
  <path class="r" transform="translate(200 -30)" d="${CLOUD}"/>
  <rect class="r" x="80" y="300" width="40" height="115"/>
  <circle class="r" cx="100" cy="250" r="75"/>
  <path class="line" d="M700,545 Q695,565 700,585"/>
  <circle class="r" cx="700" cy="500" r="45"/>
  <circle class="r" cx="700" cy="500" r="18"/>
  <ellipse class="r" cx="548" cy="425" rx="22" ry="55" transform="rotate(35 548 425)"/>
  <ellipse class="r" cx="400" cy="450" rx="120" ry="110"/>
  <ellipse class="r" cx="400" cy="480" rx="62" ry="62"/>
  <path class="r" d="M305,385 Q400,430 495,385 L490,412 Q400,458 310,412 Z"/>
  <ellipse class="r" cx="295" cy="290" rx="45" ry="85" transform="rotate(15 295 290)"/>
  <ellipse class="r" cx="505" cy="290" rx="45" ry="85" transform="rotate(-15 505 290)"/>
  <circle class="r" cx="400" cy="300" r="110"/>
  <ellipse class="r" cx="400" cy="335" rx="62" ry="46"/>
  <path class="r" d="M375,360 Q400,432 425,360 Z"/>
  <path class="line" d="M345,350 Q372,378 400,360 Q428,378 455,350"/>
  <ellipse class="r" cx="400" cy="312" rx="26" ry="18"/>
  <circle class="r" cx="358" cy="272" r="20"/>
  <circle class="r" cx="442" cy="272" r="20"/>
  <ellipse class="r" cx="350" cy="545" rx="42" ry="28"/>
  <ellipse class="r" cx="450" cy="545" rx="42" ry="28"/>`;

const HOUSE_SVG = `
  <rect class="r" x="3" y="3" width="794" height="594"/>
  <path class="r" d="M-3000,470 H3 Q200,442 400,465 T797,452 H3800 V3600 H-3000 Z"/>
  <circle class="r" cx="150" cy="100" r="55"/>
  <path class="r" transform="translate(380 -60)" d="${CLOUD}"/>
  <path class="r" d="M360,482 L440,482 L520,597 L280,597 Z"/>
  <rect class="r" x="640" y="330" width="36" height="150"/>
  <circle class="r" cx="658" cy="285" r="78"/>
  <rect class="r" x="470" y="150" width="45" height="90"/>
  <rect class="r" x="250" y="260" width="300" height="222"/>
  <polygon class="r" points="215,268 400,130 585,268"/>
  <circle class="r" cx="400" cy="205" r="30"/>
  <rect class="r" x="360" y="372" width="80" height="110"/>
  <circle class="r" cx="428" cy="428" r="7"/>
  <rect class="r" x="285" y="310" width="60" height="60"/>
  <rect class="r" x="455" y="310" width="60" height="60"/>
  <path class="line" d="M315,310 V370 M285,340 H345 M485,310 V370 M455,340 H515"/>
  <ellipse class="r" cx="190" cy="462" rx="55" ry="38"/>
  <path class="line" d="M120,540 V585"/>
  <circle class="r" cx="120" cy="515" r="32"/>
  <circle class="r" cx="120" cy="515" r="12"/>`;

const FISH_SVG = `
  <rect class="r" x="3" y="3" width="794" height="594"/>
  <path class="r" d="M-3000,500 H3 Q200,470 400,495 T797,485 H3800 V3600 H-3000 Z"/>
  <ellipse class="r" cx="110" cy="440" rx="28" ry="90"/>
  <ellipse class="r" cx="170" cy="460" rx="24" ry="70"/>
  <ellipse class="r" cx="700" cy="430" rx="30" ry="100"/>
  <circle class="r" cx="210" cy="205" r="26"/>
  <circle class="r" cx="175" cy="140" r="20"/>
  <circle class="r" cx="225" cy="85" r="16"/>
  <polygon class="r" points="520,300 650,205 650,395"/>
  <path class="r" d="M320,215 Q385,60 460,215 Z"/>
  <path class="r" d="M340,390 Q395,490 460,380 Z"/>
  <ellipse class="r" cx="380" cy="300" rx="170" ry="110"/>
  <ellipse class="r" cx="410" cy="300" rx="42" ry="104"/>

/* ---------- Screens ---------- */
function show(name) {
  ['home', 'paint', 'done'].forEach(s => $(s).classList.toggle('on', s === name));
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';

// Home gallery: one card per picture, showing current progress; green check if finished.
// Cards start empty and fill in as they scroll into view (see lazy loading above).
function buildGallery() {
  const g = $('gallery');
  if (cardObserver) cardObserver.disconnect();
  g.innerHTML = '';
  cardObserver = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) fillCard(e.target, e.target._img); else emptyCard(e.target);
  }), { root: $('galleryWrap'), rootMargin: '400px 0px' });
  IMAGES.forEach(img => {
    const p = save[img.id] || { fills: {} };
    const b = document.createElement('button');
    b.className = 'card';
    b.setAttribute('aria-label', 'Color this picture');
    b._img = img;
    if (p.done) b.insertAdjacentHTML('beforeend', `<div class="badge">${CHECK}</div>`);
    b.onclick = () => openImage(img);
    g.appendChild(b);
    cardObserver.observe(b);

/* ---------- Paint screen ---------- */
let cur = null;          // picture being colored
let curStyle = 's';      // s = solid, p = sparkle, t = stripes
let curColor = 0;        // index into COLORS
let hist = [];           // undo stack for this visit: { rid, prev, key, added }

function updateUndo() { $('undoBtn').disabled = !hist.length; }

let galleryScroll = 0;   // where the home list was scrolled to, so Home puts you back there
function openImage(img) {
  galleryScroll = $('galleryWrap').scrollTop;
  ensureLoaded(img).then(ok => {
    if (!ok) return;
    if (cur && cur !== img) releaseRaster(cur);
    cur = img;
    hist = []; updateUndo();
    $('art').replaceChildren(makeView(img, prog(img.id)));
    renderTools();
    show('paint');
  });
}
function goHome() {
  if (cur) cur.thumb = null;                         // preview must be rebuilt with the new coloring
  releaseRaster(cur);                                // free the big bitmaps before the gallery draws
  $('art').replaceChildren(); $('doneArt').replaceChildren();
  show('home'); buildGallery();
  $('galleryWrap').scrollTop = galleryScroll;
}

// Left dots show the chosen color in each style; bottom palette shows all colors in the chosen style

  $('cats').innerHTML = ['s', 'p', 't'].map(st =>
    `<button class="dot ${st === curStyle ? 'active' : ''}" data-st="${st}" aria-label="Style">${swatchSVG(st + curColor)}</button>`).join('');
  $('pal').innerHTML = COLORS.map((c, i) =>
    `<button class="sw ${i === curColor ? 'active' : ''}" data-i="${i}" aria-label="${c.n}">${swatchSVG(curStyle + i)}</button>`).join('');
}

  curStyle = b.dataset.st; renderTools();

});

  curColor = +b.dataset.i; renderTools();

$('art').addEventListener('pointerdown', e => {
